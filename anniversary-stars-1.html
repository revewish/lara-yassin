<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yassin & Lara</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e23">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}

:root{
--void:#080b1c;
--indigo:#1b2550;
--gold:#d4af7a;
--starlight:#f0f0ff;
--silverblue:#8ecae6;
}

body{
background:
radial-gradient(ellipse 70% 50% at 50% -10%, rgba(142,202,230,0.14), transparent 60%),
radial-gradient(ellipse 60% 45% at 85% 100%, rgba(212,175,122,0.10), transparent 60%),
var(--void);
color:var(--starlight);
font-family:'Manrope',sans-serif;
min-height:100vh;
margin:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
overflow:hidden;
position:relative;
padding:28px 16px;
}

.star{
position:absolute;
border-radius:50%;
background:var(--starlight);
pointer-events:none;
animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{
0%,100%{opacity:0.15; transform:scale(1);}
50%{opacity:1; transform:scale(1.4);}
}

.shooting{
position:absolute;
width:2px;
height:2px;
background:var(--starlight);
border-radius:50%;
box-shadow:0 0 6px 1px var(--starlight);
opacity:0;
animation:shoot 7s linear infinite;
}
.shooting::before{
content:"";
position:absolute;
top:0; right:0;
width:70px;
height:1px;
background:linear-gradient(90deg, var(--starlight), transparent);
}
@keyframes shoot{
0%{opacity:0; transform:translate(0,0);}
2%{opacity:1;}
14%{opacity:0; transform:translate(-260px,150px);}
100%{opacity:0;}
}

.frame{
position:relative;
width:100%;
max-width:min(90vw, 700px);
border-radius:26px;
padding:1.5px;
background:linear-gradient(135deg, var(--silverblue), var(--gold) 50%, var(--indigo));
z-index:2;
animation:glow 5s ease-in-out infinite;
}
@keyframes glow{
0%,100%{box-shadow:0 0 24px -4px rgba(142,202,230,0.35);}
50%{box-shadow:0 0 34px -2px rgba(212,175,122,0.4);}
}

.card{
position:relative;
width:100%;
padding:clamp(32px,4.5vw,58px) clamp(24px,4.5vw,52px) clamp(28px,4vw,44px);
border-radius:24px;
background:rgba(9,12,32,0.92);
backdrop-filter:blur(14px);
display:flex;
flex-direction:column;
align-items:center;
}

.badge{
position:relative;
margin:clamp(-46px,-5vw,-40px) auto 24px;
width:fit-content;
background:var(--void);
border:1px solid rgba(142,202,230,0.18);
padding:9px 22px;
border-radius:30px;
box-shadow:0 0 18px rgba(142,202,230,0.18);
z-index:3;
}

.badge-title{
font-size:clamp(9px,1.1vw,12px);
letter-spacing:2.5px;
color:var(--silverblue);
text-align:center;
margin-bottom:8px;
font-weight:700;
text-transform:uppercase;
}

.cd-row{
display:flex;
gap:clamp(10px,1.8vw,20px);
justify-content:center;
}

.cd-num{
font-family:'Space Mono',monospace;
font-weight:700;
font-size:clamp(14px,2.2vw,24px);
color:var(--starlight);
transition:transform .2s ease;
display:block;
text-align:center;
}
.cd-lab{
font-family:'Manrope',sans-serif;
font-size:clamp(7px,0.9vw,10px);
letter-spacing:0.5px;
color:rgba(240,240,255,0.4);
text-align:center;
margin-top:3px;
text-transform:uppercase;
}

.eyebrow{
font-size:clamp(9px,1.1vw,12px);
letter-spacing:4px;
color:var(--gold);
text-transform:uppercase;
text-align:center;
margin-bottom:14px;
font-weight:700;
}

.title{
font-family:'Cinzel',serif;
font-weight:600;
font-size:clamp(28px,5.6vw,52px);
text-align:center;
line-height:1.25;
margin-bottom:8px;
letter-spacing:1px;
background:linear-gradient(90deg, var(--silverblue), var(--starlight) 45%, var(--gold));
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

/* constellation signature */
.constellation{
width:clamp(120px,16vw,160px);
height:clamp(44px,6vw,58px);
margin:8px 0 20px;
}
.constellation .node{
animation:pulse 2.6s ease-in-out infinite;
}
.constellation .node:nth-child(2){animation-delay:0.6s;}
.constellation .line{
stroke-dasharray:120;
stroke-dashoffset:120;
animation:draw 2.4s ease forwards;
}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes pulse{
0%,100%{opacity:0.55; r:2.6;}
50%{opacity:1; r:3.6;}
}

.counter-frame{
display:flex;
gap:0;
justify-content:center;
align-items:flex-start;
flex-wrap:nowrap;
overflow-x:auto;
}

.box{
text-align:center;
position:relative;
padding:0 clamp(8px,1.5vw,18px);
min-width:44px;
}

.box:not(:last-child)::after{
content:"";
position:absolute;
right:-1px;
top:12px;
width:1px;
height:clamp(20px,3vw,30px);
background:linear-gradient(180deg, transparent, rgba(142,202,230,0.2), transparent);
}

.number{
font-family:'Space Mono',monospace;
font-weight:700;
font-size:clamp(20px,4.6vw,54px);
color:var(--starlight);
transition:transform 0.25s ease,color 0.25s ease,text-shadow 0.25s ease;
display:block;
text-shadow:0 0 16px rgba(142,202,230,0.18);
}

.label{
font-family:'Manrope',sans-serif;
font-size:clamp(7px,1vw,11px);
letter-spacing:0.8px;
color:rgba(240,240,255,0.42);
margin-top:6px;
text-transform:uppercase;
}

.pulse{
transform:scale(1.2);
color:var(--gold);
text-shadow:0 0 18px rgba(212,175,122,0.7);
}

.subtitle{
font-family:'Manrope',sans-serif;
font-weight:400;
font-style:italic;
font-size:clamp(13px,1.5vw,17px);
color:rgba(240,240,255,0.55);
margin-top:26px;
text-align:center;
z-index:2;
}

@media (max-width:380px){
.card{padding:28px 14px 22px;}
.box{padding:0 6px; min-width:36px;}
.cd-row{gap:6px;}
}

</style>
</head>

<body>

<div class="frame">
<div class="card">

<div class="badge">
<div class="badge-title">Next Anniversary In</div>
<div class="cd-row">
<div class="box"><span class="cd-num" id="cd_months">0</span><div class="cd-lab">Mo</div></div>
<div class="box"><span class="cd-num" id="cd_days">0</span><div class="cd-lab">Day</div></div>
<div class="box"><span class="cd-num" id="cd_hours">0</span><div class="cd-lab">Hr</div></div>
<div class="box"><span class="cd-num" id="cd_minutes">0</span><div class="cd-lab">Min</div></div>
<div class="box"><span class="cd-num" id="cd_seconds">0</span><div class="cd-lab">Sec</div></div>
</div>
</div>

<div class="eyebrow">Written in the stars</div>
<div class="title">Yassin &amp; Lara</div>

<svg class="constellation" viewBox="0 0 160 58" fill="none">
<line class="line" x1="18" y1="42" x2="80" y2="14" stroke="var(--silverblue)" stroke-width="1"/>
<line class="line" x1="80" y1="14" x2="142" y2="42" stroke="var(--gold)" stroke-width="1" style="animation-delay:0.4s"/>
<line class="line" x1="80" y1="14" x2="80" y2="44" stroke="rgba(240,240,255,0.35)" stroke-width="1" style="animation-delay:0.8s"/>
<circle class="node" cx="18" cy="42" r="3" fill="var(--silverblue)"/>
<circle class="node" cx="142" cy="42" r="3" fill="var(--gold)"/>
<circle cx="80" cy="14" r="3.4" fill="var(--starlight)"/>
<circle cx="80" cy="44" r="2" fill="rgba(240,240,255,0.6)"/>
</svg>

<div class="counter-frame">
<div class="box"><span class="number" id="years">0</span><div class="label">Years</div></div>
<div class="box"><span class="number" id="months">0</span><div class="label">Months</div></div>
<div class="box"><span class="number" id="days">0</span><div class="label">Days</div></div>
<div class="box"><span class="number" id="hours">0</span><div class="label">Hours</div></div>
<div class="box"><span class="number" id="minutes">0</span><div class="label">Min</div></div>
<div class="box"><span class="number" id="seconds">0</span><div class="label">Sec</div></div>
</div>

<div class="subtitle">— two stars, one constellation —</div>
</div>
</div>

<script>

// starfield
for(let i=0;i<45;i++){
const s=document.createElement("div");
s.className="star";
const size=1+Math.random()*2;
s.style.width=size+"px";
s.style.height=size+"px";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDuration=(1.8+Math.random()*3)+"s";
s.style.animationDelay=(Math.random()*4)+"s";
document.body.appendChild(s);
}

// shooting stars
for(let i=0;i<3;i++){
const sh=document.createElement("div");
sh.className="shooting";
sh.style.top=(5+Math.random()*35)+"%";
sh.style.left=(55+Math.random()*35)+"%";
sh.style.animationDelay=(Math.random()*7)+"s";
document.body.appendChild(sh);
}

const startDate=new Date(2026,6,14,0,0,0);

function setVal(id,val){
const el=document.getElementById(id);
if(el&&el.textContent!=val){
el.textContent=val;
el.classList.add("pulse");
setTimeout(()=>{el.classList.remove("pulse")},400);
}
}

function updateCounter(){

const now=new Date();

let years=now.getFullYear()-startDate.getFullYear();
let months=now.getMonth()-startDate.getMonth();
let days=now.getDate()-startDate.getDate();

if(days<0){
months--;
let lastMonth=new Date(now.getFullYear(),now.getMonth(),0);
days+=lastMonth.getDate();
}

if(months<0){
years--;
months+=12;
}

let hours=now.getHours()-startDate.getHours();
let minutes=now.getMinutes()-startDate.getMinutes();
let seconds=now.getSeconds()-startDate.getSeconds();

if(seconds<0){seconds+=60;minutes--;}
if(minutes<0){minutes+=60;hours--;}
if(hours<0){hours+=24;days--;}

setVal("years",years);
setVal("months",months);
setVal("days",days);
setVal("hours",hours);
setVal("minutes",minutes);
setVal("seconds",seconds);

}

function updateCountdown(){

const now=new Date();
let nextYear=now.getFullYear();
let nextAnniversary=new Date(nextYear,6,14,0,0,0);

if(now>=nextAnniversary){
nextAnniversary.setFullYear(nextYear+1);
}

let diffMs=nextAnniversary-now;

let tempDate=new Date(now);
let mCount=0;

while(true){

let checkDate=new Date(tempDate);
checkDate.setMonth(checkDate.getMonth()+1);

if(checkDate<=nextAnniversary){
tempDate.setMonth(tempDate.getMonth()+1);
mCount++;
}else{
break;
}

}

let dCount=Math.floor((nextAnniversary-tempDate)/(1000*60*60*24));
let hours=Math.floor((diffMs%(1000*60*60*24))/(1000*60*60));
let minutes=Math.floor((diffMs%(1000*60*60))/(1000*60));
let seconds=Math.floor((diffMs%(1000*60))/1000);

setVal("cd_months",mCount);
setVal("cd_days",dCount);
setVal("cd_hours",hours);
setVal("cd_minutes",minutes);
setVal("cd_seconds",seconds);

}

setInterval(()=>{
updateCounter();
updateCountdown();
},1000);

updateCounter();
updateCountdown();

</script>

</body>
</html>
